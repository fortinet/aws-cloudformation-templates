<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A3E9D"/>
    </marker>
  </defs>

  <rect width="1500" height="1090" fill="#FFFFFF"/>

  <text x="750" y="42" text-anchor="middle" font-size="27" font-weight="bold" fill="#1A1A1A">FortiGate-VM + AWS Gateway Load Balancer — Cross-AZ Inspection</text>
  <text x="750" y="70" text-anchor="middle" font-size="15" fill="#555555">fortigate-gwlb-crossaz.json  ·  2 FortiGate-VMs  ·  2 Availability Zones  ·  distributed GWLB endpoints</text>

  <!-- Internet -->
  <rect x="630" y="92" width="240" height="44" rx="22" fill="#FFF3E0" stroke="#E08600" stroke-width="2"/>
  <text x="750" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#8A5200">Internet</text>
  <path d="M690,136 L500,198" stroke="#8A8A8A" stroke-width="2" fill="none" marker-end="url(#arg)"/>
  <path d="M810,136 L1110,200" stroke="#8A8A8A" stroke-width="2" fill="none" marker-end="url(#arg)"/>

  <!-- ================= CUSTOMER VPC ================= -->
  <rect x="40" y="170" width="670" height="800" rx="10" fill="#F4F8FB" stroke="#2E6E9E" stroke-width="2.5"/>
  <text x="58" y="194" font-size="18" font-weight="bold" fill="#1B4E75">Customer VPC  ·  20.1.0.0/16</text>
  <rect x="300" y="202" width="340" height="48" rx="6" fill="#FFF3E0" stroke="#E08600" stroke-width="1.8"/>
  <text x="470" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5200">Internet Gateway</text>
  <text x="470" y="233" text-anchor="middle" font-size="10.5" fill="#8A5200">edge route table (CsEdgeRt) — ingress routing:</text>
  <text x="470" y="245" text-anchor="middle" font-size="10.5" fill="#8A5200">20.1.1.0/24 → GWLBe-AZ1   ·   20.1.3.0/24 → GWLBe-AZ2</text>

  <!-- Customer AZ1 -->
  <rect x="58" y="262" width="634" height="336" rx="8" fill="#FFFFFF" stroke="#9BB8CE" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="74" y="284" font-size="14" font-weight="bold" fill="#1B4E75">Availability Zone 1  (AZ1)</text>
  <rect x="76" y="296" width="598" height="128" rx="6" fill="#EAF2F8" stroke="#7FA6C4" stroke-width="1.4"/>
  <text x="90" y="316" font-size="12.5" font-weight="bold" fill="#1B4E75">public-az1  ·  20.1.0.0/24</text>
  <text x="90" y="334" font-size="11.5" fill="#44607A">CsPublicRt: 0.0.0.0/0 → IGW</text>
  <rect x="396" y="328" width="264" height="82" rx="6" fill="#FFE8CC" stroke="#E08600" stroke-width="1.8"/>
  <text x="528" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5200">GWLB Endpoint — AZ1</text>
  <text x="528" y="371" text-anchor="middle" font-size="11.5" fill="#8A5200">GwlbEndpointAz1</text>
  <text x="528" y="388" text-anchor="middle" font-size="11.5" fill="#8A5200">VpcEndpointType:</text>
  <text x="528" y="403" text-anchor="middle" font-size="11.5" fill="#8A5200">GatewayLoadBalancer</text>
  <rect x="76" y="442" width="598" height="140" rx="6" fill="#EAF2F8" stroke="#7FA6C4" stroke-width="1.4"/>
  <text x="90" y="462" font-size="12.5" font-weight="bold" fill="#1B4E75">private-az1  ·  20.1.1.0/24</text>
  <text x="90" y="480" font-size="11.5" fill="#44607A">CsPrivateRtAz1:</text>
  <text x="90" y="496" font-size="11.5" fill="#44607A">0.0.0.0/0 → GWLBe-AZ1</text>
  <rect x="396" y="492" width="264" height="72" rx="6" fill="#FFFFFF" stroke="#6B8FAE" stroke-width="1.6"/>
  <text x="528" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B4E75">Workload (yours)</text>
  <text x="528" y="536" text-anchor="middle" font-size="11.5" fill="#44607A">not created by the stack</text>
  <text x="528" y="552" text-anchor="middle" font-size="11.5" fill="#44607A">give it an EIP — there is no NAT GW</text>

  <!-- Customer AZ2 -->
  <rect x="58" y="618" width="634" height="336" rx="8" fill="#FFFFFF" stroke="#9BB8CE" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="74" y="640" font-size="14" font-weight="bold" fill="#1B4E75">Availability Zone 2  (AZ2)</text>
  <rect x="76" y="652" width="598" height="128" rx="6" fill="#EAF2F8" stroke="#7FA6C4" stroke-width="1.4"/>
  <text x="90" y="672" font-size="12.5" font-weight="bold" fill="#1B4E75">public-az2  ·  20.1.2.0/24</text>
  <text x="90" y="690" font-size="11.5" fill="#44607A">CsPublicRt: 0.0.0.0/0 → IGW</text>
  <rect x="396" y="684" width="264" height="82" rx="6" fill="#FFE8CC" stroke="#E08600" stroke-width="1.8"/>
  <text x="528" y="708" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5200">GWLB Endpoint — AZ2</text>
  <text x="528" y="727" text-anchor="middle" font-size="11.5" fill="#8A5200">GwlbEndpointAz2</text>
  <text x="528" y="744" text-anchor="middle" font-size="11.5" fill="#8A5200">VpcEndpointType:</text>
  <text x="528" y="759" text-anchor="middle" font-size="11.5" fill="#8A5200">GatewayLoadBalancer</text>
  <rect x="76" y="798" width="598" height="140" rx="6" fill="#EAF2F8" stroke="#7FA6C4" stroke-width="1.4"/>
  <text x="90" y="818" font-size="12.5" font-weight="bold" fill="#1B4E75">private-az2  ·  20.1.3.0/24</text>
  <text x="90" y="836" font-size="11.5" fill="#44607A">CsPrivateRtAz2:</text>
  <text x="90" y="852" font-size="11.5" fill="#44607A">0.0.0.0/0 → GWLBe-AZ2</text>
  <rect x="396" y="848" width="264" height="72" rx="6" fill="#FFFFFF" stroke="#6B8FAE" stroke-width="1.6"/>
  <text x="528" y="872" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B4E75">Workload (yours)</text>
  <text x="528" y="892" text-anchor="middle" font-size="11.5" fill="#44607A">not created by the stack</text>
  <text x="528" y="908" text-anchor="middle" font-size="11.5" fill="#44607A">give it an EIP — there is no NAT GW</text>

  <!-- ================= SECURITY VPC ================= -->
  <rect x="790" y="170" width="670" height="800" rx="10" fill="#FBF5F5" stroke="#B4413A" stroke-width="2.5"/>
  <text x="808" y="194" font-size="18" font-weight="bold" fill="#8F2B25">Security VPC (FortiGate)  ·  10.1.0.0/16</text>
  <rect x="1030" y="206" width="196" height="44" rx="6" fill="#FFF3E0" stroke="#E08600" stroke-width="1.8"/>
  <text x="1128" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5200">Internet Gateway</text>
  <text x="1128" y="240" text-anchor="middle" font-size="10.5" fill="#8A5200">SecurityPublicRt: 0.0.0.0/0</text>
  <rect x="1240" y="206" width="200" height="44" rx="6" fill="#FFF3E0" stroke="#E08600" stroke-width="1.8"/>
  <text x="1340" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A5200">S3 Gateway Endpoint</text>
  <text x="1340" y="240" text-anchor="middle" font-size="10.5" fill="#8A5200">only when UseS3Bootstrap=true</text>

  <!-- GWLB band -->
  <rect x="806" y="262" width="122" height="692" rx="8" fill="#FFE8CC" stroke="#E08600" stroke-width="2.2"/>
  <g transform="translate(867,608) rotate(-90)">
    <text x="0" y="-30" text-anchor="middle" font-size="16" font-weight="bold" fill="#8A5200">Gateway Load Balancer</text>
    <text x="0" y="-8" text-anchor="middle" font-size="12" fill="#8A5200">type: gateway  ·  cross-zone: enabled  ·  VPC Endpoint Service</text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#8A5200">Target group: GENEVE 6081  ·  health check TCP 8008</text>
    <text x="0" y="28" text-anchor="middle" font-size="12" fill="#8A5200">its own ENIs sit in private-az1 and private-az2</text>
  </g>

  <!-- Security AZ1 -->
  <rect x="958" y="262" width="486" height="336" rx="8" fill="#FFFFFF" stroke="#D0A09C" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="974" y="284" font-size="14" font-weight="bold" fill="#8F2B25">Availability Zone 1  (AZ1)</text>
  <rect x="974" y="296" width="456" height="128" rx="6" fill="#F7EAEA" stroke="#C48D89" stroke-width="1.4"/>
  <text x="988" y="316" font-size="12.5" font-weight="bold" fill="#8F2B25">public-az1  ·  10.1.0.0/24</text>
  <text x="988" y="334" font-size="11.5" fill="#6B3230">0.0.0.0/0 → IGW</text>
  <rect x="1152" y="328" width="262" height="82" rx="6" fill="#FFFFFF" stroke="#B4413A" stroke-width="1.8"/>
  <text x="1283" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2B25">port1 — public</text>
  <text x="1283" y="369" text-anchor="middle" font-size="11.5" fill="#6B3230">DHCP  ·  Elastic IP (Fgt1Eip)</text>
  <text x="1283" y="386" text-anchor="middle" font-size="11.5" fill="#6B3230">mgmt: HTTPS AdminSPort, SSH</text>
  <text x="1283" y="402" text-anchor="middle" font-size="11.5" fill="#6B3230">SG: PublicAllowSg</text>
  <rect x="974" y="442" width="456" height="140" rx="6" fill="#F7EAEA" stroke="#C48D89" stroke-width="1.4"/>
  <text x="988" y="462" font-size="12.5" font-weight="bold" fill="#8F2B25">private-az1  ·  10.1.1.0/24</text>
  <text x="988" y="480" font-size="11.5" fill="#6B3230">SecurityPrivateRtAz1:</text>
  <text x="988" y="496" font-size="11.5" fill="#6B3230">0.0.0.0/0 → port2 ENI</text>
  <rect x="1152" y="448" width="262" height="128" rx="6" fill="#FFFFFF" stroke="#B4413A" stroke-width="1.8"/>
  <text x="1283" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2B25">port2 — private</text>
  <text x="1283" y="489" text-anchor="middle" font-size="11.5" fill="#6B3230">VDOM: FG-traffic</text>
  <text x="1283" y="506" text-anchor="middle" font-size="11.5" fill="#6B3230">GENEVE: awsgeneve + awsgeneve2</text>
  <text x="1283" y="523" text-anchor="middle" font-size="11.5" fill="#6B3230">zone awszone  ·  probe-response</text>
  <text x="1283" y="540" text-anchor="middle" font-size="11.5" fill="#6B3230">firewall policy 1: allow all, log</text>
  <text x="1283" y="557" text-anchor="middle" font-size="11.5" fill="#6B3230">SourceDestCheck: false</text>
  <text x="1283" y="571" text-anchor="middle" font-size="11.5" fill="#6B3230">SG: AllowAllSg</text>
  <rect x="1140" y="320" width="284" height="264" rx="10" fill="none" stroke="#B4413A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1424" y="312" text-anchor="end" font-size="13" font-weight="bold" fill="#B4413A">FortiGateVM-az1</text>

  <!-- Security AZ2 -->
  <rect x="958" y="618" width="486" height="336" rx="8" fill="#FFFFFF" stroke="#D0A09C" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="974" y="640" font-size="14" font-weight="bold" fill="#8F2B25">Availability Zone 2  (AZ2)</text>
  <rect x="974" y="652" width="456" height="128" rx="6" fill="#F7EAEA" stroke="#C48D89" stroke-width="1.4"/>
  <text x="988" y="672" font-size="12.5" font-weight="bold" fill="#8F2B25">public-az2  ·  10.1.2.0/24</text>
  <text x="988" y="690" font-size="11.5" fill="#6B3230">0.0.0.0/0 → IGW</text>
  <rect x="1152" y="684" width="262" height="82" rx="6" fill="#FFFFFF" stroke="#B4413A" stroke-width="1.8"/>
  <text x="1283" y="706" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2B25">port1 — public</text>
  <text x="1283" y="725" text-anchor="middle" font-size="11.5" fill="#6B3230">DHCP  ·  Elastic IP (Fgt2Eip)</text>
  <text x="1283" y="742" text-anchor="middle" font-size="11.5" fill="#6B3230">mgmt: HTTPS AdminSPort, SSH</text>
  <text x="1283" y="758" text-anchor="middle" font-size="11.5" fill="#6B3230">SG: PublicAllowSg</text>
  <rect x="974" y="798" width="456" height="140" rx="6" fill="#F7EAEA" stroke="#C48D89" stroke-width="1.4"/>
  <text x="988" y="818" font-size="12.5" font-weight="bold" fill="#8F2B25">private-az2  ·  10.1.3.0/24</text>
  <text x="988" y="836" font-size="11.5" fill="#6B3230">SecurityPrivateRtAz2:</text>
  <text x="988" y="852" font-size="11.5" fill="#6B3230">0.0.0.0/0 → port2 ENI</text>
  <rect x="1152" y="804" width="262" height="128" rx="6" fill="#FFFFFF" stroke="#B4413A" stroke-width="1.8"/>
  <text x="1283" y="826" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F2B25">port2 — private</text>
  <text x="1283" y="845" text-anchor="middle" font-size="11.5" fill="#6B3230">VDOM: FG-traffic</text>
  <text x="1283" y="862" text-anchor="middle" font-size="11.5" fill="#6B3230">GENEVE: awsgeneve + awsgeneve2</text>
  <text x="1283" y="879" text-anchor="middle" font-size="11.5" fill="#6B3230">zone awszone  ·  probe-response</text>
  <text x="1283" y="896" text-anchor="middle" font-size="11.5" fill="#6B3230">firewall policy 1: allow all, log</text>
  <text x="1283" y="913" text-anchor="middle" font-size="11.5" fill="#6B3230">SourceDestCheck: false</text>
  <text x="1283" y="927" text-anchor="middle" font-size="11.5" fill="#6B3230">SG: AllowAllSg</text>
  <rect x="1140" y="676" width="284" height="264" rx="10" fill="none" stroke="#B4413A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1424" y="668" text-anchor="end" font-size="13" font-weight="bold" fill="#B4413A">FortiGateVM-az2</text>

  <!-- flows: workload <-> endpoint -->
  <path d="M528,492 L528,412" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="556" cy="452" r="13" fill="#1F6FB2"/><text x="556" y="457" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  <path d="M528,848 L528,768" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="556" cy="808" r="13" fill="#1F6FB2"/><text x="556" y="813" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>

  <!-- endpoint <-> GWLB, across the VPC boundary -->
  <path d="M662,369 L806,369" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="734" cy="342" r="13" fill="#1F6FB2"/><text x="734" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  <path d="M662,725 L806,725" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="734" cy="698" r="13" fill="#1F6FB2"/><text x="734" y="703" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>

  <!-- GWLB <-> FortiGate GENEVE -->
  <path d="M928,520 L1150,520" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="1040" cy="546" r="13" fill="#1F6FB2"/><text x="1040" y="551" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  <path d="M928,876 L1150,876" stroke="#1F6FB2" stroke-width="2.6" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <circle cx="1040" cy="902" r="13" fill="#1F6FB2"/><text x="1040" y="907" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- cross-zone connector in the corridor between GWLB and the AZ blocks -->
  <path d="M938,520 L938,876" stroke="#7A3E9D" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#arp)" marker-start="url(#arp)"/>
  <g transform="translate(951,698) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7A3E9D">cross-zone</text>
  </g>

  <!-- legend -->
  <rect x="40" y="984" width="1420" height="90" rx="8" fill="#F7F7F7" stroke="#C9C9C9" stroke-width="1.4"/>
  <text x="58" y="1006" font-size="13.5" font-weight="bold" fill="#333333">Traffic path — the same three hops carry ingress and egress, in both directions:</text>
  <text x="58" y="1026" font-size="12.5" fill="#444444">1 — The workload subnet's route table sends every packet to the GWLB endpoint in its own AZ.      2 — The endpoint carries it across the VPC boundary to the Gateway Load Balancer, over its VPC Endpoint Service.</text>
  <text x="58" y="1045" font-size="12.5" fill="#444444">3 — GWLB forwards it, encapsulated in GENEVE on port 6081, to a FortiGate port2 tunnel interface. The FortiGate inspects it in the FG-traffic VDOM and returns it on the same tunnel, back out through the endpoint.</text>
  <text x="58" y="1064" font-size="12.5" fill="#7A3E9D">Cross-zone (dashed) — cross-zone load balancing is on and both FortiGates carry both tunnels (awsgeneve → AZ1 GWLB ENI, awsgeneve2 → AZ2 GWLB ENI), so either endpoint's flows can be inspected by either FortiGate.</text>
</svg>
